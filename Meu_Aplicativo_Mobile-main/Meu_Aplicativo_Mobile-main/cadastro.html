<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Salve sua vovo - Criar Conta</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="tela-cadastro">

        <section class="cadastro-container">

            <div class="cabecalho-cadastro">

                <div class="icone-coracao">
                    ❤
                </div>

                <h1 class="titulo-cadastro">
                    Criar conta
                </h1>

                <p class="subtitulo-cadastro">
                    Preencha seus dados para começar
                </p>

            </div>


            <form
                id="form-cadastro"
                class="formulario-cadastro"
            >

                <div class="grupo-campo">

                    <label
                        for="nome-cadastro"
                        class="label-campo"
                    >
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome-cadastro"
                        class="input-campo"
                        placeholder="Digite seu nome"
                        required
                    >

                    <small
                        id="erro-nome"
                        class="mensagem-erro"
                    ></small>

                </div>


                <div class="grupo-campo">

                    <label
                        for="email-cadastro"
                        class="label-campo"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email-cadastro"
                        class="input-campo"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <small
                        id="erro-email"
                        class="mensagem-erro"
                    ></small>

                </div>


                <div class="grupo-campo">

                    <label
                        for="senha-cadastro"
                        class="label-campo"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha-cadastro"
                        class="input-campo"
                        placeholder="Crie uma senha"
                        required
                    >

                    <small
                        id="erro-senha"
                        class="mensagem-erro"
                    ></small>

                </div>


                <div class="grupo-campo">

                    <label
                        for="confirmar-senha"
                        class="label-campo"
                    >
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        class="input-campo"
                        placeholder="Digite a senha novamente"
                        required
                    >

                    <small
                        id="erro-confirmar-senha"
                        class="mensagem-erro"
                    ></small>

                </div>


                <div class="grupo-campo">

                    <label
                        for="data-nascimento"
                        class="label-campo"
                    >
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="data-nascimento"
                        class="input-campo"
                        required
                    >

                </div>


                <label class="termos-container">

                    <input
                        type="checkbox"
                        id="aceitar-termos"
                    >

                    <span>
                        Li e aceito os Termos de Uso
                    </span>

                </label>


                <p
                    id="mensagem-cadastro"
                    class="mensagem-cadastro"
                ></p>


                <button
                    type="submit"
                    id="botao-cadastrar"
                    class="botao-principal"
                >
                    Criar conta
                </button>

            </form>


            <div class="voltar-login">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </section>

    </main>


    <script src="js/cadastro.js"></script>

</body>

</html>
